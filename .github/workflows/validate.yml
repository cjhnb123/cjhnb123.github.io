name: Validate homepage

on:
  push:
    branches:
      - blog/homepage
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Run source contracts
        run: node --test test/homepage-contract.test.mjs

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.4"
          bundler-cache: true

      - name: Build Jekyll strictly
        run: bundle exec jekyll build --strict_front_matter --trace

      - name: Run generated HTML contracts
        run: node --test test/generated-homepage.test.mjs

      - name: Upload generated site for visual review
        uses: actions/upload-artifact@v4
        with:
          name: homepage-site
          path: _site
          if-no-files-found: error
          retention-days: 7
