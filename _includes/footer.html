<footer class="site-footer">
  <div class="page-shell site-footer__inner">
    <p class="site-footer__brand">{{ site.title }}</p>
    <div class="site-footer__meta">
      <time datetime="{{ site.data.home.footer.iso_date }}">
        {{ site.data.home.footer.date }}
      </time>
      <span class="site-footer__accents" aria-hidden="true">
        {% for accent in site.data.home.footer.accents %}
          <span class="accent-square accent-square--{{ accent }}"></span>
        {% endfor %}
      </span>
    </div>
  </div>
</footer>
