<header class="site-header">
  <div class="page-shell site-header__inner">
    <a class="site-brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav class="site-nav" aria-label="首页导航">
      <ul class="site-nav__list">
        {% for item in site.data.home.navigation %}
          <li>
            <a
              class="site-nav__link{% if item.active %} is-active{% endif %}"
              href="#{{ item.target }}"
            >{{ item.label }}</a>
          </li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
